<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOAA Live Space Weather</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b14;
    color: #e8f1ff;
    font-family: Arial, sans-serif;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: auto;
    padding: 30px 0;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #8192aa;
    margin-bottom: 30px;
}

.status {
    padding: 12px;
    margin-bottom: 20px;
    background: #0d1828;
    border: 1px solid #1b3049;
    border-radius: 10px;
}

.status.ok {
    color: #42e6a4;
}

.status.error {
    color: #ff7070;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.card {
    background: #0c1726;
    border: 1px solid #1a2c42;
    border-radius: 14px;
    padding: 22px;
}

.label {
    color: #71839c;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.value {
    font-size: 35px;
    font-weight: bold;
    color: #4bbcff;
}

.unit {
    color: #71839c;
}

.main {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 15px;
    margin-top: 15px;
}

.clock-wrapper {
    text-align: center;
}

.clock {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 20px auto;
    border-radius: 50%;
    border: 2px solid #24415e;
    background: #091422;
}

.direction {
    position: absolute;
    color: #71839c;
    font-weight: bold;
}

.n {
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #4bbcff;
}

.e {
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
}

.s {
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
}

.w {
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
}

.needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 100px;
    background: #4bbcff;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(0deg);
    border-radius: 5px;
    box-shadow: 0 0 15px #4bbcff;
}

.center {
    position: absolute;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.angle {
    font-size: 28px;
    color: #4bbcff;
    font-weight: bold;
}

.chart-box {
    height: 350px;
}

.raw {
    margin-top: 20px;
}

.raw pre {
    background: #02060c;
    border: 1px solid #18283b;
    border-radius: 10px;
    padding: 15px;
    overflow: auto;
    max-height: 250px;
    color: #9fb4cd;
    font-size: 11px;
}

@media(max-width: 750px) {

    .grid,
    .main {
        grid-template-columns: 1fr;
    }

    .clock {
        width: 220px;
        height: 220px;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>Live Space Weather</h1>

<div class="subtitle">
NOAA Solar Wind & Geomagnetic Conditions
</div>

<div id="status" class="status">
Connecting to NOAA...
</div>


<div class="grid">

<div class="card">
<div class="label">IMF By</div>
<span id="by" class="value">--</span>
<span class="unit">nT</span>
</div>

<div class="card">
<div class="label">IMF Bz</div>
<span id="bz" class="value">--</span>
<span class="unit">nT</span>
</div>

<div class="card">
<div class="label">IMF Bt</div>
<span id="bt" class="value">--</span>
<span class="unit">nT</span>
</div>

</div>


<div class="main">


<div class="card clock-wrapper">

<div class="label">
IMF Clock Angle
</div>

<div class="clock">

<div class="direction n">N</div>
<div class="direction e">E</div>
<div class="direction s">S</div>
<div class="direction w">W</div>

<div
id="needle"
class="needle">
</div>

<div class="center"></div>

</div>

<div class="angle">
<span id="angle">--</span>°
</div>

<div
id="magTime"
style="color:#71839c;margin-top:10px;font-size:12px;">
Waiting...
</div>

</div>


<div class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
">

<div>

<div class="label">
Geomagnetic Activity
</div>

<div style="
font-size:18px;
font-weight:bold;
">
Kp Index
</div>

</div>

<div
id="kp"
style="
font-size:32px;
font-weight:bold;
color:#4bbcff;
">
--
</div>

</div>

<div class="chart-box">

<canvas id="kpChart"></canvas>

</div>

<div
id="kpTime"
style="
color:#71839c;
font-size:12px;
margin-top:8px;
">
Waiting...
</div>

</div>

</div>


<div class="raw">

<div class="card">

<div class="label">
Diagnostic Information
</div>

<pre id="diagnostic">
Waiting for NOAA response...
</pre>

</div>

</div>

</div>


<script>

const MAG_URL =
"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json";

const KP_URL =
"https://services.swpc.noaa.gov/json/planetary_k_index_1m.json";

let chart = null;


/* =========================================
   STATUS
========================================= */

function status(message, error = false) {

    const element =
        document.getElementById("status");

    element.textContent = message;

    element.className =
        error
        ? "status error"
        : "status ok";
}


/* =========================================
   DIAGNOSTIC
========================================= */

function diagnostic(data) {

    const element =
        document.getElementById("diagnostic");

    try {

        element.textContent =
            JSON.stringify(
                data,
                null,
                2
            );

    } catch {

        element.textContent =
            String(data);

    }
}


/* =========================================
   FETCH
========================================= */

async function getData(url) {

    const response =
        await fetch(
            url,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    return await response.json();
}


/* =========================================
   MAGNETIC DATA
========================================= */

async function loadMagnetic() {

    try {

        const data =
            await getData(MAG_URL);

        diagnostic(data);

        console.log(
            "MAG NOAA:",
            data
        );


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            throw new Error(
                "NOAA magnetic response is empty"
            );

        }


        /*
        Look through the response
        for an actual object containing
        magnetic field values.
        */

        let record = null;


        for (
            let i = data.length - 1;
            i >= 0;
            i--
        ) {

            const item = data[i];


            if (
                item &&
                typeof item === "object" &&
                !Array.isArray(item)
            ) {

                if (
                    item.Bz !== undefined ||
                    item.By !== undefined ||
                    item.Bt !== undefined
                ) {

                    record = item;

                    break;

                }

            }

        }


        /*
        If NOAA returned header/rows,
        convert those rows.
        */

        if (!record && Array.isArray(data[0])) {

            const headers = data[0];


            for (
                let i = data.length - 1;
                i >= 1;
                i--
            ) {

                const row = data[i];

                const obj = {};

                headers.forEach(
                    (header, index) => {

                        obj[header] =
                            row[index];

                    }
                );


                if (
                    obj.Bz !== undefined ||
                    obj.By !== undefined ||
                    obj.Bt !== undefined
                ) {

                    record = obj;

                    break;

                }

            }

        }


        if (!record) {

            throw new Error(
                "Could not locate By/Bz/Bt in NOAA response"
            );

        }


        const by =
            Number(record.By);

        const bz =
            Number(record.Bz);

        const bt =
            Number(record.Bt);


        console.log(
            "MAG RECORD:",
            record
        );


        if (Number.isFinite(by)) {

            document.getElementById("by")
                .textContent =
                by.toFixed(1);

        }


        if (Number.isFinite(bz)) {

            document.getElementById("bz")
                .textContent =
                bz.toFixed(1);

        }


        if (Number.isFinite(bt)) {

            document.getElementById("bt")
                .textContent =
                bt.toFixed(1);

        }


        if (
            Number.isFinite(by) &&
            Number.isFinite(bz)
        ) {

            let angle =
                Math.atan2(
                    by,
                    bz
                ) *
                180 /
                Math.PI;


            if (angle < 0) {

                angle += 360;

            }


            document.getElementById("angle")
                .textContent =
                angle.toFixed(1);


            document.getElementById("needle")
                .style.transform =
                `translate(-50%, -100%) rotate(${angle}deg)`;

        }


        const timestamp =
            record.time_tag ||
            record.timestamp ||
            record.time;


        if (timestamp) {

            document.getElementById("magTime")
                .textContent =
                new Date(timestamp)
                .toUTCString();

        }


        status(
            "✓ NOAA magnetic data connected"
        );


    } catch (error) {

        console.error(error);

        status(
            "NOAA magnetic data error: " +
            error.message,
            true
        );

    }

}


/* =========================================
   KP DATA
========================================= */

async function loadKp() {

    try {

        const data =
            await getData(KP_URL);


        console.log(
            "KP NOAA:",
            data
        );


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            throw new Error(
                "NOAA Kp response is empty"
            );

        }


        let records = [];


        /*
        Normal object format.
        */

        if (
            typeof data[0] === "object" &&
            !Array.isArray(data[0])
        ) {

            records = data;

        }


        /*
        Header + rows format.
        */

        else if (
            Array.isArray(data[0])
        ) {

            const headers =
                data[0];


            records =
                data.slice(1)
                .map(row => {

                    const obj = {};

                    headers.forEach(
                        (header, index) => {

                            obj[header] =
                                row[index];

                        }
                    );

                    return obj;

                });

        }


        const valid =
            records.filter(record => {

                return Number.isFinite(
                    Number(
                        record.kp_index
                    )
                );

            });


        if (valid.length === 0) {

            throw new Error(
                "Could not find kp_index in NOAA response"
            );

        }


        const latest =
            valid[valid.length - 1];


        const kp =
            Number(
                latest.kp_index
            );


        document.getElementById("kp")
            .textContent =
            kp.toFixed(1);


        const recent =
            valid.slice(-40);


        const labels =
            recent.map(record => {

                const date =
                    new Date(
                        record.time_tag
                    );


                return date.toLocaleTimeString(
                    "en-GB",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        timeZone: "UTC"
                    }
                );

            });


        const values =
            recent.map(record =>
                Number(
                    record.kp_index
                )
            );


        createChart(
            labels,
            values
        );


        if (latest.time_tag) {

            document.getElementById("kpTime")
                .textContent =
                new Date(
                    latest.time_tag
                ).toUTCString();

        }


    } catch (error) {

        console.error(error);

        document.getElementById("kp")
            .textContent =
            "ERR";

        console.error(
            "Kp error:",
            error.message
        );

    }

}


/* =========================================
   CHART
========================================= */

function createChart(
    labels,
    values
) {

    const canvas =
        document.getElementById(
            "kpChart"
        );


    if (chart) {

        chart.destroy();

    }


    chart =
        new Chart(
            canvas,
            {

                type: "line",

                data: {

                    labels: labels,

                    datasets: [{

                        label: "Kp",

                        data: values,

                        borderColor:
                            "#4bbcff",

                        backgroundColor:
                            "rgba(75,188,255,0.12)",

                        borderWidth: 2,

                        pointRadius: 3,

                        tension: 0.25,

                        fill: true

                    }]

                },


                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    scales: {

                        y: {

                            min: 0,

                            max: 9,

                            ticks: {
                                color: "#71839c",
                                stepSize: 1
                            },

                            grid: {
                                color:
                                "rgba(120,150,190,.1)"
                            }

                        },

                        x: {

                            ticks: {
                                color: "#71839c"
                            },

                            grid: {
                                color:
                                "rgba(120,150,190,.05)"
                            }

                        }

                    },

                    plugins: {

                        legend: {

                            labels: {
                                color: "#9aabc2"
                            }

                        }

                    }

                }

            }
        );

}


/* =========================================
   START
========================================= */

loadMagnetic();

loadKp();


/* Refresh every minute */

setInterval(
    loadMagnetic,
    60000
);

setInterval(
    loadKp,
    60000
);

</script>

</body>
</html>
